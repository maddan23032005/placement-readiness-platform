version: "3.8"

services:
  postgres:
    image: postgres:16-alpine
    container_name: prp_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: prp_user
      POSTGRES_PASSWORD: prp_password
      POSTGRES_DB: prp_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
